<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Номерок | Мини-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #161b22;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .user-lvl {
            font-size: 13px;
            font-weight: bold;
            color: #f39c12;
        }
        .user-balance {
            font-size: 14px;
            font-weight: bold;
            color: #2ecc71;
        }
        .tabs-header {
            display: flex;
            width: 100%;
            background: #161b22;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 10px;
            border: 1px solid #30363d;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            background: transparent;
            color: #8b949e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #21262d;
            color: #ffffff;
        }
        .control-box {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-box select {
            background: #0d1117;
            color: #fff;
            border: 1px solid #30363d;
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .drop-card {
            width: 100%;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .rarity-indicator {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .plate-box {
            background: #ffffff;
            color: #000000;
            border: 3px solid #000;
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 260px;
            height: 65px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .plate-main {
            font-family: monospace;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .plate-region {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 2px solid #000;
            padding-left: 8px;
            font-family: monospace;
        }
        .plate-region-num {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
        }
        .plate-rus {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .car-name-view {
            font-size: 13px;
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .reasons-box {
            width: 100%;
            background: #0d0f17;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            color: #8b949e;
            margin-top: 6px;
            border: 1px solid #21262d;
            line-height: 1.4;
        }
        .actions-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-spin {
            background-color: #f39c12;
            color: #0d0f12;
        }
        .btn-sell {
            background-color: #2ecc71;
            color: #0d0f12;
        }
        .btn-sell:disabled {
            background-color: #1a2e22;
            color: #444;
            cursor: not-allowed;
        }
        .btn-admin {
            background-color: #21262d;
            color: #8b949e;
            font-size: 11px;
            padding: 8px;
            border: 1px dashed #30363d;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 50;
        }
        .nav-item {
            font-size: 11px;
            color: #8b949e;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #f39c12;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 14px;
            width: 100%;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-content h2 {
            font-size: 16px;
            color: #e74c3c;
            text-align: center;
        }
        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: #21262d;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .admin-row input {
            width: 65px;
            background: #0d0f17;
            border: 1px solid #484f58;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .btn-close {
            background-color: #e74c3c;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <div class="user-lvl">⭐ Ур. 34</div>
            <div class="user-balance" id="balanceText">104,8 млн ₽</div>
        </div>

        <div class="tabs-header">
            <button class="tab-btn active">Номера</button>
            <button class="tab-btn" onclick="alert('Машины в разработке')">Машины</button>
            <button class="tab-btn" onclick="alert('Магазин пуст')">Магазин</button>
        </div>

        <div class="control-box">
            <div class="control-row">
                <span>📍 Тип региона:</span>
                <select id="regionTypeSelect" onchange="toggleRegionSelect()">
                    <option value="random">Случайный (2 000 ₽)</option>
                    <option value="custom">Выбранный (4 000 ₽)</option>
                </select>
            </div>
            <div class="control-row" id="customRegionRow" style="display: none;">
                <span>🇷🇺 Выбор региона:</span>
                <select id="regionSelect">
                    <option value="77">Москва (77, 777)</option>
                    <option value="78">Санкт-Петербург (78)</option>
                    <option value="50">Московская обл. (50)</option>
                    <option value="23">Краснодарский край (23)</option>
                    <option value="65">Сахалинская обл. (65)</option>
                    <option value="39">Калининградская обл. (39)</option>
                </select>
            </div>
        </div>

        <div class="drop-card">
            <div class="car-name-view" id="carTitle">Нажмите «Открыть контейнер»</div>
            <div class="rarity-indicator" id="rarityText" style="color: #8b949e;">Ожидание открытия</div>
            
            <div class="plate-box">
                <div class="plate-main" id="plateMainText">А 777 АА</div>
                <div class="plate-region">
                    <span class="plate-region-num" id="plateRegionNum">77</span>
                    <span class="plate-rus">RUS</span>
                </div>
            </div>

            <div class="reasons-box" id="reasonsBox">
                💎 Случайный регион — 2 000 ₽, выбранный — 4 000 ₽. Сделайте ставку и крутите!
            </div>
        </div>

        <div class="actions-box">
            <button class="btn-spin" id="spinBtn" onclick="spinContainer()">Открыть контейнер</button>
            <button class="btn-sell" id="sellBtn" onclick="sellItem()" disabled>Продать предмет</button>
            <button class="btn-admin" onclick="requestAdminAccess()">⚙️ Панель администратора</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active">🏠<br>Играть</button>
        <button class="nav-item" onclick="alert('Гараж пуст')">🚗<br>Гараж</button>
        <button class="nav-item" onclick="alert('Рынок закрыт')">📈<br>Рынок</button>
        <button class="nav-item" onclick="alert('Нет друзей')">👥<br>Друзья</button>
        <button class="nav-item" onclick="alert('Раздел Ещё')">⚙️<br>Ещё</button>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>⚙️ Настройка шансов (%)</h2>
            <div id="adminInputsList"></div>
            <button class="btn-spin" onclick="saveAdminChances()" style="background:#2ecc71; color:#0d0f12; padding: 10px;">Сохранить</button>
            <button class="btn-close" onclick="closeAdmin()">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 104800000;
        let currentItem = null;

        const ADMIN_HASH = "8f3c421711204d80a184ef47e5b128549a1d2d3a3d5f2f5c789547ea63351d3b";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function requestAdminAccess() {
            let inputCode = prompt("Введите ключ администратора:");
            if (!inputCode) return;
            if (await sha256(inputCode) === ADMIN_HASH) {
                openAdmin();
            } else {
                alert("Неверный ключ!");
            }
        }

        // Шансы и точные диапазоны цен под новые требования
        let rarities = [
            { name: "Обычный", chance: 40.02, color: "#95a5a6", min: 500, max: 2000 },
            { name: "Необычный", chance: 25.0, color: "#3498db", min: 2000, max: 4000 },
            { name: "Редкий", chance: 15.0, color: "#2ecc71", min: 4000, max: 15000 },
            { name: "Эпический", chance: 12.0, color: "#9b59b6", min: 4000, max: 40000 },
            { name: "Легендарный", chance: 3.33, color: "#e67e22", min: 100000, max: 300000 },
            { name: "Мифический", chance: 2.5, color: "#e74c3c", min: 1000000, max: 10000000 },
            { name: "Секретный", chance: 1.43, color: "#1abc9c", min: 10000000, max: 20000000 },
            { name: "Бесконечный", chance: 100 * (1 / 1500), color: "#34495e", min: 100000000, max: 300000000 }, // 1 к 1500 (~0.0667%)
            { name: "Божественный", chance: 100 * (1 / 2000), color: "#f1c40f", min: 300000000, max: 500000000 }, // 1 к 2000 (0.05%)
            { name: "Невозможный", chance: 100 * (1 / 10000), color: "#ff00ff", min: 1000000000, max: 10000000000 } // 1 к 10000 (0.01%)
        ];

        const cars = ["BMW M5 F90", "Mercedes-Benz G63", "Audi RS6", "Toyota Supra A90", "Porsche 911 Turbo S", "Lamborghini Urus", "Bugatti Chiron", "Rolls-Royce Ghost"];

        const impossiblePlates = [
            { l1: "Х", nums: "777", l2: "ХХ", region: "77" },
            { l1: "В", nums: "001", l2: "ВВ", region: "77" },
            { l1: "А", nums: "777", l2: "АА", region: "99" },
            { l1: "М", nums: "000", l2: "ММ", region: "777" }
        ];

        function updateUI() {
            document.getElementById('balanceText').innerText = formatMoney(balance) + ' ₽';
        }

        function formatMoney(amount) {
            if (amount >= 1000000000) return (amount / 1000000000).toFixed(1) + ' млрд';
            if (amount >= 1000000) return (amount / 1000000).toFixed(1) + ' млн';
            return amount.toLocaleString() + ' ₽';
        }

        function toggleRegionSelect() {
            const type = document.getElementById('regionTypeSelect').value;
            document.getElementById('customRegionRow').style.display = (type === 'custom') ? 'flex' : 'none';
        }

        function openAdmin() {
            const list = document.getElementById('adminInputsList');
            list.innerHTML = '';
            rarities.forEach((r, i) => {
                list.innerHTML += `
                    <div class="admin-row">
                        <span style="color: ${r.color}; font-weight:bold;">${r.name}</span>
                        <input type="number" step="any" id="ch_${i}" value="${r.chance}">
                    </div>
                `;
            });
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveAdminChances() {
            rarities.forEach((r, i) => {
                let val = parseFloat(document.getElementById(`ch_${i}`).value);
                if (!isNaN(val) && val >= 0) r.chance = val;
            });
            alert("Шансы успешно обновлены!");
            closeAdmin();
        }

        function getRandomRarity() {
            const total = rarities.reduce((sum, r) => sum + r.chance, 0);
            const rand = Math.random() * total;
            let sum = 0;
            for (let r of rarities) {
                sum += r.chance;
                if (rand <= sum) return r;
            }
            return rarities[0];
        }

        function generatePlate() {
            const letters = "АВЕКМНОРСТУХ";
            const l1 = letters[Math.floor(Math.random() * letters.length)];
            const l2 = letters[Math.floor(Math.random() * letters.length)];
            const l3 = letters[Math.floor(Math.random() * letters.length)];
            const nums = Math.floor(100 + Math.random() * 900);
            return { l1, nums, l2: `${l2}${l3}` };
        }

        function spinContainer() {
            const regionType = document.getElementById('regionTypeSelect').value;
            const spinCost = (regionType === 'custom') ? 4000 : 2000;

            if (balance < spinCost) {
                alert("Недостаточно средств на балансе для оплаты прокрутки!");
                return;
            }

            // Списываем стоимость крутки
            balance -= spinCost;

            const rarity = getRandomRarity();
            const car = cars[Math.floor(Math.random() * cars.length)];
            
            let plateObj;
            let regionNum;
            let regionMultiplier = 1.0;

            if (rarity.name === "Невозможный") {
                const imp = impossiblePlates[Math.floor(Math.random() * impossiblePlates.length)];
                plateObj = { l1: imp.l1, nums: imp.nums, l2: imp.l2 };
                regionNum = imp.region;
            } else {
                plateObj = generatePlate();
                if (regionType === 'custom') {
                    regionNum = document.getElementById('regionSelect').value;
                    if (regionNum === "77") regionMultiplier = 1.5;
                    else if (regionNum === "78") regionMultiplier = 1.3;
                    else if (regionNum === "50") regionMultiplier = 1.2;
                    else if (regionNum === "23") regionMultiplier = 1.15;
                } else {
                    regionNum = Math.floor(10 + Math.random() * 90).toString();
                    if (regionNum === "77") regionMultiplier = 1.5;
                }
            }

            let basePrice = Math.floor(rarity.min + Math.random() * (rarity.max - rarity.min));
            let price = Math.floor(basePrice * regionMultiplier);

            currentItem = { car, plateObj, rarity, price, regionNum, spinCost, regionType };

            document.getElementById('carTitle').innerText = car;
            document.getElementById('plateMainText').innerText = `${plateObj.l1} ${plateObj.nums} ${plateObj.l2}`;
            document.getElementById('plateRegionNum').innerText = regionNum;

            const rTag = document.getElementById('rarityText');
            rTag.innerText = `Редкость: ${rarity.name}`;
            rTag.style.color = rarity.color;

            let reasonsHTML = `💸 Стоимость крутки: <b>-${formatMoney(spinCost)}</b><br>`;
            reasonsHTML += `✨ Удача: выпал редкий класс [${rarity.name}]<br>`;
            if (rarity.name === "Невозможный") {
                reasonsHTML += `🔥 Легендарный уникальный номер из единичной партии!<br>`;
            } else if (regionNum === "77") {
                reasonsHTML += `🏙️ Престижный столичный регион (Москва) увеличил стоимость<br>`;
            }
            reasonsHTML += `💰 Итоговая оценка: <b>${formatMoney(price)}</b>`;

            document.getElementById('reasonsBox').innerHTML = reasonsHTML;
            document.getElementById('sellBtn').disabled = false;
            updateUI();
        }

        function sellItem() {
            if (!currentItem) return;
            balance += currentItem.price;
            updateUI();

            document.getElementById('carTitle').innerText = "Успешно продано!";
