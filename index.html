<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Номерок | Мини-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121619;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            color: #f1c40f;
            margin-bottom: 4px;
        }
        .balance-card {
            background: #1e252b;
            border: 1px solid #2c343d;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .drop-card {
            width: 100%;
            background: #1a2128;
            border: 2px solid #2c343d;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 180px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.4);
            position: relative;
        }
        .car-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .plate-view {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            background: #0d1117;
            padding: 12px 24px;
            border-radius: 8px;
            border: 3px solid #30363d;
            margin-bottom: 12px;
            text-align: center;
        }
        .rarity-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-open {
            background-color: #f1c40f;
            color: #121619;
        }
        .btn-sell {
            background-color: #2ecc71;
            color: #121619;
        }
        .btn-sell:disabled {
            background-color: #1b3324;
            color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Номерок</h1>
            <p style="font-size: 13px; color: #8b949e;">Контейнеры с авто и номерами</p>
        </header>

        <div class="balance-card" id="balanceDisplay">Баланс: 0 $</div>

        <div class="drop-card" id="dropCard">
            <div class="car-title" id="carTitle">Нажмите кнопку ниже</div>
            <div class="plate-view" id="plateView" style="border-color: #30363d;">А 777 АА 77</div>
            <div class="rarity-badge" id="rarityBadge" style="background: #30363d; color: #fff;">Ожидание</div>
        </div>

        <div class="actions">
            <button class="btn-open" id="openBtn" onclick="openContainer()">Открыть контейнер (Бесплатно)</button>
            <button class="btn-sell" id="sellBtn" onclick="sellItem()" disabled>Продать предмет</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let currentItem = null;

        const rarities = [
            { name: "Обычный", chance: 28, color: "#95a5a6", min: 100, max: 500 },
            { name: "Необычный", chance: 22, color: "#3498db", min: 600, max: 1500 },
            { name: "Редкий", chance: 16, color: "#2ecc71", min: 2000, max: 5000 },
            { name: "Эпический", chance: 11, color: "#9b59b6", min: 6000, max: 15000 },
            { name: "Легендарный", chance: 7.5, color: "#e67e22", min: 20000, max: 50000 },
            { name: "Мифический", chance: 5.5, color: "#e74c3c", min: 70000, max: 150000 },
            { name: "Секретный", chance: 4, color: "#1abc9c", min: 200000, max: 500000 },
            { name: "Бесконечный", chance: 3.5, color: "#34495e", min: 50000000, max: 100000000 },
            { name: "Божественный", chance: 2.4, color: "#f1c40f", min: 50000000, max: 100000000 },
            { name: "Невозможный", chance: 0.083, color: "#ff00ff", min: 1000000000, max: 10000000000 }
        ];

        const cars = ["BMW M5 F90", "Mercedes AMG GT", "Audi RS6 Avant", "Toyota Supra A90", "Porsche 911 Turbo", "Lamborghini Urus", "Bugatti Chiron", "Nissan GT-R"];

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = `Баланс: ${formatMoney(balance)} $`;
        }

        function formatMoney(amount) {
            if (amount >= 1000000000) return (amount / 1000000000).toFixed(1) + ' ККК';
            if (amount >= 1000000) return (amount / 1000000).toFixed(1) + ' млн';
            return amount.toLocaleString() + ' $';
        }

        function getRandomRarity() {
            const rand = Math.random() * 100;
            let sum = 0;
            for (let r of rarities) {
                sum += r.chance;
                if (rand <= sum) return r;
            }
            return rarities[0];
        }

        function generatePlate() {
            const letters = "АВЕКМНОРСТУХ";
            const l1 = letters[Math.floor(Math.random() * letters.length)];
            const l2 = letters[Math.floor(Math.random() * letters.length)];
            const l3 = letters[Math.floor(Math.random() * letters.length)];
            const nums = Math.floor(100 + Math.random() * 900);
            const region = Math.floor(10 + Math.random() * 90);
            return `${l1}${nums}${l2}${l3} ${region}`;
        }

        function openContainer() {
            const rarity = getRandomRarity();
            const plate = generatePlate();
            const car = cars[Math.floor(Math.random() * cars.length)];
            const price = Math.floor(rarity.min + Math.random() * (rarity.max - rarity.min));

            currentItem = { rarity, plate, car, price };

            // Обновляем интерфейс выдачи
            document.getElementById('carTitle').innerText = car;
            document.getElementById('plateView').innerText = plate;
            document.getElementById('plateView').style.borderColor = rarity.color;
            
            const badge = document.getElementById('rarityBadge');
            badge.innerText = `${rarity.name} • ${formatMoney(price)}`;
            badge.style.background = rarity.color;
            badge.style.color = (rarity.name === "Бесконечный" || rarity.name === "Невозможный") ? "#fff" : "#121619";

            document.getElementById('sellBtn').disabled = false;
        }

        function sellItem() {
            if (!currentItem) return;
            balance += currentItem.price;
            updateUI();

            document.getElementById('carTitle').innerText = "Успешно продано!";
            document.getElementById('rarityBadge').innerText = `+${formatMoney(currentItem.price)}`;
            document.getElementById('rarityBadge').style.background = "#2ecc71";
            document.getElementById('rarityBadge').style.color = "#121619";

            currentItem = null;
            document.getElementById('sellBtn').disabled = true;
        }

        updateUI();
    </script>
</body>
</html>
