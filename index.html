<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Номерок | Генератор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f39c12;
        }
        .balance {
            font-size: 18px;
            color: #2ecc71;
            font-weight: bold;
            background: #1a1e24;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .case-box {
            width: 100%;
            height: 140px;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .roulette-track {
            display: flex;
            position: absolute;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1);
            will-change: transform;
        }
        .roulette-item {
            min-width: 130px;
            height: 100px;
            background: #21262d;
            border-radius: 10px;
            margin: 0 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 2px solid #484f58;
        }
        .item-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            text-align: center;
        }
        .item-rarity {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .result-display {
            text-align: center;
            margin-bottom: 20px;
            min-height: 80px;
        }
        .result-plate {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 10px 20px;
            background: #21262d;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 8px;
            border: 2px solid #30363d;
        }
        .result-info {
            font-size: 14px;
            color: #8b949e;
        }
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-spin {
            background-color: #f39c12;
            color: #0d0f12;
        }
        .btn-spin:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        .btn-sell {
            background-color: #2ecc71;
            color: #0d0f12;
        }
        .btn-sell:disabled {
            background-color: #213527;
            color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Номерок</h1>
            <p>Контейнеры с авто и номерами</p>
        </header>

        <div class="balance" id="balanceText">Баланс: 0 $</div>

        <div class="case-box" id="caseBox">
            <div class="roulette-track" id="rouletteTrack">
                <!-- Элементы рулетки генерируются динамически -->
            </div>
        </div>

        <div class="result-display">
            <div class="result-plate" id="resultPlate">ХХХ 777 ХХ</div>
            <div class="result-info" id="resultInfo">Нажмите кнопку ниже, чтобы открыть контейнер!</div>
        </div>

        <div class="buttons-group">
            <button class="btn-spin" id="spinBtn" onclick="startSpin()">Открыть контейнер (Бесплатно)</button>
            <button class="btn-sell" id="sellBtn" onclick="sellItem()" disabled>Продать предмет</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let currentItem = null;
        let isSpinning = false;

        const rarities = [
            { name: "Обычный", chance: 28, color: "#95a5a6", minPrice: 100, maxPrice: 500 },
            { name: "Необычный", chance: 22, color: "#3498db", minPrice: 600, maxPrice: 1500 },
            { name: "Редкий", chance: 16, color: "#2ecc71", minPrice: 2000, maxPrice: 5000 },
            { name: "Эпический", chance: 11, color: "#9b59b6", minPrice: 6000, maxPrice: 15000 },
            { name: "Легендарный", chance: 7.5, color: "#e67e22", minPrice: 20000, maxPrice: 50000 },
            { name: "Мифический", chance: 5.5, color: "#e74c3c", minPrice: 70000, maxPrice: 150000 },
            { name: "Секретный", chance: 4, color: "#1abc9c", minPrice: 200000, maxPrice: 500000 },
            { name: "Бесконечный", chance: 3.5, color: "#34495e", minPrice: 50000000, maxPrice: 100000000 },
            { name: "Божественный", chance: 2.4, color: "#f1c40f", minPrice: 50000000, maxPrice: 100000000 },
            { name: "Невозможный", chance: 0.083, color: "#ff00ff", minPrice: 1000000000, maxPrice: 10000000000 }
        ];

        const carNames = ["BMW M5", "Mercedes AMG", "Audi RS6", "Toyota Supra", "Porsche 911", "Lamborghini", "Bugatti Chiron", "Nissan GTR"];

        function updateUI() {
            document.getElementById('balanceText').innerText = `Баланс: ${formatMoney(balance)} $`;
        }

        function formatMoney(amount) {
            if (amount >= 1000000000) return (amount / 1000000000).toFixed(1) + ' ККК';
            if (amount >= 1000000) return (amount / 1000000).toFixed(1) + ' млн';
            return amount.toLocaleString() + ' $';
        }

        function getRandomRarity() {
            const rand = Math.random() * 100;
            let sum = 0;
            for (let r of rarities) {
                sum += r.chance;
                if (rand <= sum) return r;
            }
            return rarities[0];
        }

        function generatePlate() {
            const letters = "АВЕКМНОРСТУХ";
            const l1 = letters[Math.floor(Math.random() * letters.length)];
            const l2 = letters[Math.floor(Math.random() * letters.length)];
            const l3 = letters[Math.floor(Math.random() * letters.length)];
            const nums = Math.floor(100 + Math.random() * 900);
            const region = Math.floor(10 + Math.random() * 90);
            return `${l1}${nums}${l2}${l3} ${region}`;
        }

        function createRouletteItem(plate, car, rarity) {
            const div = document.createElement('div');
            div.className = 'roulette-item';
            div.style.borderColor = rarity.color;
            div.innerHTML = `
                <div class="item-name" style="color: ${rarity.color}">${plate}</div>
                <div class="item-info" style="font-size:10px; color:#aaa;">${car}</div>
                <div class="item-rarity" style="background: ${rarity.color}; color: #000; margin-top:4px;">${rarity.name}</div>
            `;
            return div;
        }

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('sellBtn').disabled = true;

            const track = document.getElementById('rouletteTrack');
            track.innerHTML = '';

            // Генерируем ленту прокрутки (пусть будет 30 элементов, победный — 25-й)
            let winningItemData = null;
            const totalItems = 30;
            const winningIndex = 25;

            for (let i = 0; i < totalItems; i++) {
                const rarity = (i === winningIndex) ? getRandomRarity() : rarities[Math.floor(Math.random() * rarities.length)];
                const plate = generatePlate();
                    const car = carNames[Math.floor(Math.random() * carNames.length)];
                
                if (i === winningIndex) {
                    winningItemData = { rarity, plate, car };
                }

                track.appendChild(createRouletteItem(plate, car, rarity));
            }

            // Сбрасываем позицию
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            setTimeout(() => {
                const itemWidth = 140; // ширина карточки + отступы
                const offset = (winningIndex * itemWidth) - 130; // центрируем
                track.style.transition = 'transform 3.5s cubic-bezier(0.08, 0.82, 0.17, 1)';
                track.style.transform = `translateX(-${offset}px)`;
            }, 50);

            setTimeout(() => {
                isSpinning = false;
                currentItem = winningItemData;
                
                // Рассчитываем цену
                const price = Math.floor(currentItem.rarity.minPrice + Math.random() * (currentItem.rarity.maxPrice - currentItem.rarity.minPrice));
                currentItem.price = price;

                // Показываем результат
                document.getElementById('resultPlate').innerText = currentItem.plate;
                document.getElementById('resultPlate').style.borderColor = currentItem.rarity.color;
                document.getElementById('resultInfo').innerHTML = `Авто: <b>${currentItem.car}</b> | <span style="color:${currentItem.rarity.color}">[${currentItem.rarity.name}]</span><br>Цена продажи: <b>${formatMoney(price)}</b>`;

                document.getElementById('spinBtn').disabled = false;
                document.getElementById('sellBtn').disabled = false;
            }, 3600);
        }

        function sellItem() {
            if (!currentItem) return;
            balance += currentItem.price;
            updateUI();

            document.getElementById('resultInfo').innerHTML = `<span style="color: #2ecc71;">Успешно продано за ${formatMoney(currentItem.price)}!</span>`;
            currentItem = null;
            document.getElementById('sellBtn').disabled = true;
        }

        updateUI();
    </script>
</body>
</html>
